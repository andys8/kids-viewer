name: Build APK

on:
  push:
    branches:
      - main
      - master
      - '**'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate APK
        id: apk
        run: echo "path=$(find app/build/outputs/apk/debug -name '*.apk' | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kids-viewer-debug-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Publish rolling release with APK
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug-build
          name: Latest debug build
          body: |
            Automatically built from commit ${{ github.sha }} on branch `${{ github.ref_name }}`.

            This is a debug-signed APK meant for installing directly on your own phone.
            Tap the `.apk` file below to download it, then open it to install
            (you may need to allow "install unknown apps" for your browser once).
          prerelease: true
          files: ${{ steps.apk.outputs.path }}
