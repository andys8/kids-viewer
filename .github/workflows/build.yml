name: Build APK

on:
  push:
    branches:
      - master
      - main
      - '**'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Name the build
        id: meta
        run: |
          set -euo pipefail
          stamp="$(date -u +'%Y%m%d-%H%M%S')"
          apk="$(find app/build/outputs/apk/debug -name '*.apk' | head -n1)"
          cp "$apk" "kids-viewer-${stamp}.apk"
          {
            echo "tag=build-${stamp}"
            echo "name=Kids Viewer $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo "apk=kids-viewer-${stamp}.apk"
          } >> "$GITHUB_OUTPUT"

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kids-viewer-debug-apk
          path: ${{ steps.meta.outputs.apk }}

      # Each build gets its own release, so previous builds stay installable.
      - name: Publish release with APK
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          body: |
            Built from commit ${{ github.sha }}.

            Debug-signed APK for installing directly on your phone: tap the `.apk`
            file below to download it, then open it to install (you may need to
            allow "install unknown apps" for your browser once).
          files: ${{ steps.meta.outputs.apk }}
