name: Play Store release

# Manual trigger only: you decide when a build goes to the Play Store.
on:
  workflow_dispatch:
    inputs:
      track:
        description: Play track to publish to
        type: choice
        default: internal
        options:
          - internal
          - alpha
          - beta
          - production
      version_name:
        description: Version name shown to users (leave empty to auto-derive)
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: play-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the commit count is used as the Play version code.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Work out version numbers
        id: version
        run: |
          set -euo pipefail
          code="$(git rev-list --count HEAD)"
          name="${{ inputs.version_name }}"
          if [ -z "$name" ]; then
            name="1.0.${code}"
          fi
          {
            echo "code=${code}"
            echo "name=${name}"
          } >> "$GITHUB_OUTPUT"

      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "KEYSTORE_BASE64 secret is not set - see docs/PLAY_STORE.md" >&2
            exit 1
          fi
          printf '%s' "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/upload.jks"

      - name: Build signed bundle and APK
        env:
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
          KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease --stacktrace

      - name: Publish to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.andys8.kidsviewer
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: completed
          whatsNewDirectory: distribution/whatsnew

      - name: Publish a GitHub release with the signed APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Kids Photo Viewer ${{ steps.version.outputs.name }}
          body: |
            Published to the Google Play **${{ inputs.track }}** track from commit ${{ github.sha }}.

            The `.apk` below is the same build, signed with the upload key, for
            installing directly without Play. Note that once the app is on Play,
            you cannot have both versions installed at once - uninstall one first.
          files: app/build/outputs/apk/release/app-release.apk
