name: Release

# Every merge to the default branch produces a release. Pull requests and other
# branches run the same build and checks, but publish nothing.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the commit count is the build number.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # The commit count is the build number: it only ever goes up, and unlike a workflow run
      # number it survives renaming this file. The version code is offset past the highest code
      # already published by the old timestamp-tagged builds, so updates keep installing over
      # what people already have.
      - name: Work out the version
        id: version
        run: |
          set -euo pipefail
          build="$(git rev-list --count HEAD)"
          name="1.0.${build}"
          {
            echo "code=$((100 + build))"
            echo "name=${name}"
            echo "tag=v${name}"
            echo "apk=kids-photo-viewer-${name}.apk"
            echo "mapping=mapping-${name}.txt.gz"
          } >> "$GITHUB_OUTPUT"

      # A real release key when the secrets are configured, the checked-in debug key otherwise,
      # so the build works in any checkout. Which one was used ends up in the release notes.
      - name: Prepare the signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            printf '%s' "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/release.jks"
            echo "keystore=${RUNNER_TEMP}/release.jks" >> "$GITHUB_OUTPUT"
            echo "kind=release" >> "$GITHUB_OUTPUT"
          else
            echo "No KEYSTORE_BASE64 secret; falling back to the checked-in debug key."
            echo "keystore=" >> "$GITHUB_OUTPUT"
            echo "kind=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Run lint
        env:
          BUILD_NUMBER: ${{ steps.version.outputs.code }}
          BUILD_STAMP: ${{ steps.version.outputs.name }}
        run: ./gradlew lintRelease --stacktrace

      # The Gradle output only names the first failure, which hides the rest behind a re-run.
      - name: Show the full lint report
        if: failure()
        run: |
          report=app/build/reports/lint-results-release.txt
          [ -f "$report" ] && cat "$report" || echo "No lint report was produced."

      - name: Run unit tests
        env:
          BUILD_NUMBER: ${{ steps.version.outputs.code }}
          BUILD_STAMP: ${{ steps.version.outputs.name }}
        run: ./gradlew testReleaseUnitTest --stacktrace

      - name: Build the release APK
        env:
          BUILD_NUMBER: ${{ steps.version.outputs.code }}
          BUILD_STAMP: ${{ steps.version.outputs.name }}
          KEYSTORE_PATH: ${{ steps.signing.outputs.keystore }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      # Proof the APK is actually signed and installable before it is handed to anyone. A build
      # that produces an unsigned or v1-only APK fails here rather than on someone's phone.
      - name: Verify the signature
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/release -name '*.apk' | head -n1)"
          apksigner="$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -n1)"
          "$apksigner" verify --min-sdk-version 26 --print-certs --verbose "$apk"

      - name: Collect the release files
        id: files
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/release -name '*.apk' | head -n1)"
          cp "$apk" "${{ steps.version.outputs.apk }}"
          sha256sum "${{ steps.version.outputs.apk }}" > "${{ steps.version.outputs.apk }}.sha256"
          echo "sha256=$(cut -d' ' -f1 < "${{ steps.version.outputs.apk }}.sha256")" >> "$GITHUB_OUTPUT"
          # The R8 mapping file, so an obfuscated stack trace can be read back later. Compose
          # makes it enormous -- many times the size of the APK -- so it ships gzipped.
          mapping="app/build/outputs/mapping/release/mapping.txt"
          if [ -f "$mapping" ]; then
            gzip -c "$mapping" > "${{ steps.version.outputs.mapping }}"
          fi

      - name: Upload the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kids-photo-viewer-apk
          path: |
            ${{ steps.version.outputs.apk }}
            ${{ steps.version.outputs.apk }}.sha256

      - name: Publish the release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Kids Photo Viewer ${{ steps.version.outputs.name }}
          make_latest: true
          generate_release_notes: true
          body: |
            ## Install

            Download **`${{ steps.version.outputs.apk }}`** below on your Android phone and
            open it. Android will ask once for permission to install apps from your browser --
            allow it, then open the app and grant access to your photos and videos.

            Installing over an earlier version keeps everything as it was. See the
            [README](https://github.com/andys8/kids-viewer#installing-on-your-phone) for the
            full walkthrough and for automatic updates via Obtainium.

            ## This build

            | | |
            | --- | --- |
            | Version | `${{ steps.version.outputs.name }}` (version code `${{ steps.version.outputs.code }}`) |
            | Commit | ${{ github.sha }} |
            | Signing key | `${{ steps.signing.outputs.kind }}` |
            | Minimum Android | 8.0 (API 26) |
            | SHA-256 | `${{ steps.files.outputs.sha256 }}` |

            Verify the download before installing:

            ```
            sha256sum -c ${{ steps.version.outputs.apk }}.sha256
            ```
          files: |
            ${{ steps.version.outputs.apk }}
            ${{ steps.version.outputs.apk }}.sha256
            ${{ steps.version.outputs.mapping }}
